name: Daily Domain Warmup

on:
  schedule:
    # Runs everyday automatically at 9:00 AM UTC (adjust to your preference)
    - cron: '0 9 * * *'
  workflow_dispatch: # This allows you to click a button and run it manually anytime

jobs:
  warm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Nodemailer dependency
        run: npm install nodemailer

      - name: Execute Warmup Script
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DAILY_VOLUME: "3" # Manual Control: Increase this number by 2-3 every week!
        run: node warmup.js
